<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neptor Technologies &mdash; Admin Console Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #0f0f10;
            --bg-card: #141415;
            --bg-input: #1c1c1f;
            --bg-input-focus: #222226;
            --border-hairline: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --text-primary: #ededed;
            --text-secondary: #a1a1a6;
            --text-muted: #6e6e73;
            --accent: #d97706;
            --btn-bg: #ededed;
            --btn-text: #0f0f10;
            --btn-hover: #ffffff;
            --danger-bg: rgba(229, 72, 77, 0.1);
            --danger-border: rgba(229, 72, 77, 0.25);
            --danger-text: #e5484d;
            --success-bg: rgba(76, 195, 138, 0.1);
            --success-border: rgba(76, 195, 138, 0.25);
            --success-text: #4cc38a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .brand-pip {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent);
            display: inline-block;
        }

        .system-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #4cc38a;
        }

        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-hairline);
            border-radius: 12px;
            padding: 32px 28px;
        }

        .card-header {
            margin-bottom: 24px;
        }

        .card-header h1 {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .card-header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.45;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            height: 40px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-hairline);
            border-radius: 8px;
            padding: 0 12px;
            font-size: 0.875rem;
            color: var(--text-primary);
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        .form-input:hover {
            border-color: var(--border-hover);
        }

        .form-input:focus {
            background-color: var(--bg-input-focus);
            border-color: rgba(255, 255, 255, 0.35);
        }

        .btn-submit {
            width: 100%;
            height: 40px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.15s ease, transform 0.05s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: var(--btn-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .demo-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-hairline);
        }

        .demo-title {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 10px;
        }

        .demo-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn-demo {
            background: transparent;
            border: 1px solid var(--border-hairline);
            border-radius: 6px;
            padding: 6px 8px;
            color: var(--text-secondary);
            font-family: "JetBrains Mono", monospace;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
            transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
        }

        .btn-demo:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }

        .alert-box {
            display: none;
            margin-top: 16px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.8125rem;
            line-height: 1.45;
        }

        .alert-danger {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger-text);
        }

        .alert-success {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .login-footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .login-footer a:hover {
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand-header">
            <div class="brand-title">
                <span class="brand-pip"></span>
                <span>Neptor Technologies</span>
            </div>
            <div class="system-status">
                <span class="status-dot"></span>
                <span>Admin Console</span>
            </div>
        </div>

        <div class="login-card">
            <div class="card-header">
                <h1>Sign in to Admin Console</h1>
                <p>Manage drafts, review side-by-side diffs, and approve website modifications.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Account Identifier</label>
                    <div class="input-wrapper">
                        <input class="form-input" type="text" id="email" name="email" value="admin@neptor.in" required autofocus autocomplete="username" placeholder="admin@neptor.in" />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <input class="form-input" type="password" id="password" name="password" value="neptor123" required autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" />
                    </div>
                </div>

                <button class="btn-submit" type="submit" id="submitBtn">
                    <span>Sign In</span>
                </button>
            </form>

            <div id="alertBox" class="alert-box"></div>

            <div class="demo-section">
                <div class="demo-title">Test Multi-Tenant Isolation</div>
                <div class="demo-buttons">
                    <button class="btn-demo" type="button" onclick="setDemoUser('admin@neptor.in')">admin</button>
                    <button class="btn-demo" type="button" onclick="setDemoUser('concurrency1')">user 1</button>
                    <button class="btn-demo" type="button" onclick="setDemoUser('concurrency2')">user 2</button>
                </div>
            </div>
        </div>

        <div class="login-footer">
            <p>Neptor Technologies &bull; <a href="/health">Health API</a></p>
        </div>
    </div>

    <script>
        function setDemoUser(userId) {
            document.getElementById("email").value = userId;
            document.getElementById("password").value = "neptor123";
        }

        const loginForm = document.getElementById("loginForm");
        const alertBox = document.getElementById("alertBox");
        const submitBtn = document.getElementById("submitBtn");

        loginForm.addEventListener("submit", async function(e) {
            e.preventDefault();
            alertBox.style.display = "none";
            submitBtn.disabled = true;
            submitBtn.textContent = "Authenticating...";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                const res = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    alertBox.className = "alert-box alert-success";
                    alertBox.textContent = "Signed in successfully. Redirecting to Dashboard...";
                    alertBox.style.display = "block";
                    setTimeout(() => {
                        window.location.href = "/admin/dashboard";
                    }, 400);
                } else {
                    alertBox.className = "alert-box alert-danger";
                    alertBox.textContent = data.detail || "Authentication failed. Check credentials.";
                    alertBox.style.display = "block";
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Sign In";
                }
            } catch (err) {
                alertBox.className = "alert-box alert-danger";
                alertBox.textContent = "Network error connecting to API server.";
                alertBox.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.textContent = "Sign In";
            }
        });
    </script>
</body>
</html>
